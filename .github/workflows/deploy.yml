name: Deploy to Production

on:
  push:
    branches: [ "main" ] # Triggers when code is pushed to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build
          
      - name: Prepare Staging Directory
        # We prepare a staging directory to easily upload without Zip
        # Notice we don't run composer install locally; we'll do it on the server to avoid uploading the massive vendor folder!
        run: |
          mkdir deployment_staging
          cp -r app bootstrap config database public resources routes artisan composer.json composer.lock package.json package-lock.json deployment_staging/
          
      - name: Transfer Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "deployment_staging"
          target: "/home/cs2team58/"

      - name: Execute Remote SSH Commands & Laravel Setup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            TARGET_DIR="/home/cs2team58/TeamProject_58"
            
            mkdir -p $TARGET_DIR
            
            # Ensure storage framework directories exist
            mkdir -p $TARGET_DIR/storage/app/public
            mkdir -p $TARGET_DIR/storage/framework/cache/data
            mkdir -p $TARGET_DIR/storage/framework/sessions
            mkdir -p $TARGET_DIR/storage/framework/views
            mkdir -p $TARGET_DIR/storage/logs
            
            # Move uploaded files from staging
            cp -r /home/cs2team58/deployment_staging/* $TARGET_DIR/
            rm -rf /home/cs2team58/deployment_staging
            
            cd $TARGET_DIR
            
            # Set symlink for public_html
            rm -rf /home/cs2team58/public_html
            ln -sfn $TARGET_DIR/public /home/cs2team58/public_html
            
            # Install PHP dependencies natively on the remote server
            composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist
            
            # Fix directory permissions for Laravel
            chmod -R 775 storage bootstrap/cache
            
            # Execute Laravel optimizing/migration commands if a .env exists
            if [ -f .env ]; then
              php artisan optimize:clear
              php artisan migrate --force
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              php artisan storage:link || true
            else
              echo "WARNING: .env file missing in $TARGET_DIR. Please create it manually on the server!"
            fi
