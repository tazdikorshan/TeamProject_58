name: Deploy to Production

on:
  push:
    branches: [ "main" ] # By default, triggers when code is pushed to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Update to match your Laravel version if needed
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer Dependencies
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Create Deployment Artifact (Zip)
        # Zipping the files prevents the long wait times of uploading thousands of individual files
        run: zip -r deployment.zip . -q -x "*.git*" "node_modules/*" "tests/*"

      - name: Transfer Zip to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "deployment.zip"
          target: "/home/cs2team58/"

      - name: Execute Remote SSH Commands & Laravel Setup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Target directory for your app. If "public_html" is your main web folder, you can change this.
            TARGET_DIR="/home/cs2team58/TeamProject_58"
            
            mkdir -p $TARGET_DIR
            
            # Extract and clean up the zip file
            unzip -o /home/cs2team58/deployment.zip -d $TARGET_DIR
            rm /home/cs2team58/deployment.zip
            
            cd $TARGET_DIR
            
            # Fix directory permissions for Laravel
            chmod -R 775 storage bootstrap/cache
            
            # Execute Laravel optimizing/migration commands if a .env exists
            if [ -f .env ]; then
              php artisan optimize:clear
              
              # Run migrations without interactive prompt
              php artisan migrate --force
              
              # Cache settings for performance 
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              
              # Link storage if not already linked
              php artisan storage:link || true
            else
              echo "WARNING: .env file missing in $TARGET_DIR. Please create it manually on the server!"
            fi
